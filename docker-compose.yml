services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - RAG_MODEL=${RAG_MODEL:-anthropic/claude-haiku-4.5}
    volumes:
      - chroma_data:/app/data/rag_store
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  chroma_data:
  qdrant_data:
